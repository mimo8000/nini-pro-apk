name: Build APK
"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Web Dependencies
        working-directory: app/src/main/assets/public
        run: |
          rm -rf node_modules package-lock.json bun.lock
          npm install

      - name: Build Web App
        working-directory: app/src/main/assets/public
        run: npm run build

      - name: Prepare Assets
        run: |
          cp -r app/src/main/assets/public/dist /tmp/web-dist
          rm -rf app/src/main/assets/public
          mkdir -p app/src/main/assets/public
          cp -r /tmp/web-dist/* app/src/main/assets/public/
          rm -rf /tmp/web-dist

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
          validate-wrappers: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find . -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR=No APK found" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 5
